name: Deploy Chaos Haus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Show repository files
        run: |
          echo "Repository root:"
          ls -la
          echo "Package files:"
          find . -maxdepth 2 \( -name "package.json" -o -name "package-lock.json" -o -name "yarn.lock" \)

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Verify static export
        run: |
          if [ ! -d "./out" ]; then
            echo "ERROR: ./out directory was not created"
            exit 1
          fi
          ls -la ./out

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
